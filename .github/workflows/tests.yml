name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check public files
        run: python tools/check_public_files.py
      - name: Run tests without credentials or SDK
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q tt_gpt tools tests
      - name: Check Linux installer syntax
        if: runner.os == 'Linux'
        run: sh -n deploy/install.sh
